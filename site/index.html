<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Atlas</title>
<meta name="description" content="A personal AI knowledge atlas for foundations, machine learning, LLMs, agents, RAG, evaluation, safety, product engineering, and repeatable playbooks.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://ldamoredev.github.io/ai-notes/">
<link rel="alternate" hreflang="en" href="https://ldamoredev.github.io/ai-notes/en/">
<link rel="alternate" hreflang="es" href="https://ldamoredev.github.io/ai-notes/es/">
<link rel="alternate" hreflang="x-default" href="https://ldamoredev.github.io/ai-notes/">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#22d3ee">
<style>
html,body{height:100%;margin:0}body{display:grid;place-items:center;background:#0b1020;color:#e5eefb;font-family:Inter,system-ui,sans-serif;padding:24px}.landing{display:grid;gap:18px;text-align:center}.landing-sub{color:#22d3ee;font-weight:700}h1{font-size:2rem;margin:0}.lang-choices{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.lang-choice{color:#e5eefb;text-decoration:none;border:1px solid #26324d;background:#11182b;padding:10px 18px;border-radius:8px;font-weight:700}.lang-choice:hover{border-color:#22d3ee;color:#22d3ee}
</style>
<script>
(function(){var locales=["en", "es"];var saved;try{saved=localStorage.getItem('preferred-locale')}catch(e){}var nav=(navigator.language||'en').slice(0,2).toLowerCase();var pick=(saved&&locales.indexOf(saved)>=0)?saved:(locales.indexOf(nav)>=0?nav:'en');location.replace(pick+'/');})();
</script>
</head>
<body><main class="landing"><div class="landing-sub">AI Atlas</div><h1>Choose your language</h1><div class="lang-choices"><a class="lang-choice" href="en/" hreflang="en">English</a><a class="lang-choice" href="es/" hreflang="es">Español</a></div></main></body>
</html>
